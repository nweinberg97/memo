<title>Memo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Raleway:wght@600;700;800;900&display=swap">
<style>
/* Layout concept: an editorial discovery app framed by a slim navy "prototype" bar;
   member side reads like a magazine of posters, business side like a calm studio desk. */
:root {
  --bg: #F2F7F6;          /* sea mist */
  --bg-2: #E6F0EE;
  --surface: #FFFFFF;
  --ink: #0A2B3A;         /* deck navy, deepened */
  --ink-2: #44616C;
  --ink-3: #7B949C;
  --line: #D6E4E1;
  --line-2: #C3D6D2;
  --accent: #19B5A4;      /* Memo teal */
  --accent-ink: #0A7A70;
  --accent-soft: #D7F3EE;
  --mint: #74E5D6;
  --deep: #053F57;        /* deck background */
  --on-deep: #E9FAF7;
  --coral: #EC5B4A;
  --sun: #F2A93B;
  --good: #1E9E6A;
  --warn: #C98418;
  --shadow: 0 1px 2px rgba(10,43,58,.06), 0 8px 24px -12px rgba(10,43,58,.18);
  --shadow-lg: 0 24px 60px -24px rgba(5,63,87,.45);
  --f-display: 'Raleway', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r-media: 16px;
  --r-panel: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #04283A; --bg-2: #073246; --surface: #0A3A50; --ink: #E7F6F3; --ink-2: #A9C6CC; --ink-3: #78979F;
  --line: #134A61; --line-2: #1C5B74; --accent: #35D3C0; --accent-ink: #6FE6D6; --accent-soft: #0D4A55;
  --deep: #021C29; --on-deep: #E9FAF7; --coral: #FF7462; --good: #4CD08F; --warn: #F2B65A;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6); --shadow-lg: 0 24px 60px -24px rgba(0,0,0,.7);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #04283A; --bg-2: #073246; --surface: #0A3A50; --ink: #E7F6F3; --ink-2: #A9C6CC; --ink-3: #78979F;
  --line: #134A61; --line-2: #1C5B74; --accent: #35D3C0; --accent-ink: #6FE6D6; --accent-soft: #0D4A55;
  --deep: #021C29; --on-deep: #E9FAF7; --coral: #FF7462; --good: #4CD08F; --warn: #F2B65A;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6); --shadow-lg: 0 24px 60px -24px rgba(0,0,0,.7);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 400 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; font-feature-settings: "lnum"; }
h1, h2, h3, h4 { font-family: var(--f-display); font-feature-settings: "lnum"; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
input, textarea, select { font: inherit; color: var(--ink); }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: 700 11.5px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

/* ---------- Logo ---------- */
.logo { display: inline-flex; align-items: center; gap: 8px; }
.logo .mark { display: block; flex: none; }
.wordmark { font: 800 1em/1 var(--f-display); letter-spacing: .04em; color: var(--ink); }
.demobar .wordmark, .on-deep .wordmark { color: var(--mint); }

/* ---------- Prototype frame bar ---------- */
.demobar { background: var(--deep); color: var(--on-deep); font-size: 13px; }
.demobar .in { display: flex; align-items: center; gap: 14px; min-height: 46px; padding-block: 6px; flex-wrap: wrap; }
.demobar .tag { font: 700 10.5px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: rgba(233,250,247,.55); padding-left: 14px; border-left: 1px solid rgba(233,250,247,.18); }
.seg { display: inline-flex; background: rgba(255,255,255,.08); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: rgba(233,250,247,.75); transition: background .2s, color .2s; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: #2CC6B4; color: #032A3A; }
.seg button:hover:not([aria-pressed="true"]) { color: #fff; }
.demobar .spacer { flex: 1; }
.demobar .link { color: rgba(233,250,247,.7); font-size: 12.5px; text-decoration: none; }
.demobar .link:hover { color: #fff; }
@media (max-width: 640px) { .demobar .tag, .demobar .hide-sm { display: none; } .seg button { padding: 6px 11px; } }

/* ---------- Buttons & chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 999px; font-weight: 650; font-size: 14.5px; line-height: 1.1; transition: transform .15s, background .2s, box-shadow .2s, color .2s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: #032A3A; }
.btn-primary:hover { background: var(--mint); }
.btn-dark { background: var(--ink); color: var(--bg); }
.btn-dark:hover { opacity: .9; }
.btn-ghost { border: 1px solid var(--line-2); background: var(--surface); }
.btn-ghost:hover { border-color: var(--accent); }
.btn-sm { padding: 8px 13px; font-size: 13px; }
.btn-lg { padding: 14px 24px; font-size: 16px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; display: inline-grid; place-items: center; border: 1px solid var(--line); background: var(--surface); transition: border-color .2s, background .2s, color .2s; flex: none; }
.icon-btn:hover { border-color: var(--accent); }
.icon-btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.icon-btn svg, .btn svg { width: 18px; height: 18px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13.5px; font-weight: 550; transition: all .18s; white-space: nowrap; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .x { opacity: .6; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 650; background: var(--bg-2); color: var(--ink-2); white-space: nowrap; }
.pill.live { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill.draft { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.new { background: var(--coral); color: #fff; }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.reason { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--accent-ink); font-weight: 600; }
.reason svg { width: 14px; height: 14px; }

/* ---------- Posters / media ---------- */
.media { position: relative; overflow: hidden; border-radius: var(--r-media); background: var(--deep); isolation: isolate; }
.media .poster, .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.card:hover .media .poster, .card:hover .media img { transform: scale(1.04); }
.media .badge { position: absolute; left: 10px; top: 10px; z-index: 2; background: rgba(3,30,42,.72); color: #fff; backdrop-filter: blur(6px); font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; letter-spacing: .02em; }
.media .badge-r { left: auto; right: 50px; }
.media .play { position: absolute; z-index: 2; right: 12px; bottom: 12px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; color: #082A38; }
.media .play svg { width: 16px; height: 16px; margin-left: 2px; }
.media .datebox { position: absolute; z-index: 2; left: 10px; bottom: 10px; background: #fff; color: #082A38; border-radius: 10px; padding: 5px 9px; text-align: center; line-height: 1.05; }
.media .datebox b { display: block; font: 800 18px/1 var(--f-display); }
.media .datebox small { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.save-fab { position: absolute; z-index: 3; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.9); color: #082A38; transition: transform .15s, background .2s; }
.save-fab:hover { transform: scale(1.08); }
.save-fab svg { width: 16px; height: 16px; }
.save-fab.on { background: var(--coral); color: #fff; }

/* ---------- Cards ---------- */
.card { display: flex; flex-direction: column; gap: 10px; text-align: left; min-width: 0; cursor: pointer; }
.card .media { aspect-ratio: 4 / 3; }
.card.tall .media { aspect-ratio: 4 / 5; }
.card h3 { font-size: 17px; font-weight: 750; line-height: 1.25; }
.card .meta { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.card .biz-line { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.mono { width: 22px; height: 22px; border-radius: 7px; display: inline-grid; place-items: center; font: 800 9.5px/1 var(--f-display); color: #fff; flex: none; letter-spacing: .02em; }
.mono.lg { width: 64px; height: 64px; border-radius: 18px; font-size: 22px; box-shadow: 0 0 0 4px var(--surface); }
.mono.md { width: 40px; height: 40px; border-radius: 12px; font-size: 14px; }

.row-scroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: none; }
.row-scroll::-webkit-scrollbar { display: none; }
.row-scroll > * { scroll-snap-align: start; }
@media (min-width: 900px) { .row-scroll.cols-4 { grid-auto-columns: calc((100% - 60px) / 4); } .row-scroll.cols-3 { grid-auto-columns: calc((100% - 40px) / 3); } }
@media (max-width: 600px) { .row-scroll { grid-auto-columns: 72%; gap: 14px; } }

.section { padding-block: 34px 6px; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.sec-head h2 { font-size: clamp(22px, 2.4vw, 28px); font-weight: 800; }
.sec-head p { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.sec-head .arrows { display: flex; gap: 8px; }
@media (max-width: 700px) { .sec-head .arrows { display: none; } }

/* ---------- Member top nav ---------- */
.m-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.m-top .in { display: flex; align-items: center; gap: 22px; height: 66px; }
.m-nav { display: flex; gap: 4px; }
.m-nav button { padding: 8px 14px; border-radius: 999px; font-weight: 650; font-size: 14.5px; color: var(--ink-2); }
.m-nav button[aria-current="page"] { color: var(--ink); background: var(--bg-2); }
.m-nav button:hover { color: var(--ink); }
.m-search { flex: 1; max-width: 420px; margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-3); font-size: 14px; text-align: left; }
.m-search:hover { border-color: var(--accent); }
.m-search svg { width: 17px; height: 17px; }
.m-search kbd { margin-left: auto; font: 600 11px var(--f-body); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 6px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #2CC6B4, #0D5A75); color: #fff; display: grid; place-items: center; font: 800 13px var(--f-display); flex: none; }
.tabbar { display: none; }
@media (max-width: 760px) {
  .m-nav, .m-top .m-search { display: none; }
  .m-top .in { height: 58px; justify-content: space-between; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tabbar button { display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 650; color: var(--ink-3); padding: 4px; }
  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button[aria-current="page"] { color: var(--accent-ink); }
  .m-main { padding-bottom: 90px; }
}

/* ---------- Landing ---------- */
.landing { position: relative; overflow: hidden; }
.land-hero { display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(28px, 5vw, 70px); align-items: center; padding-block: clamp(40px, 7vw, 88px) 40px; }
.land-hero h1 { font-size: clamp(40px, 6.2vw, 78px); font-weight: 800; line-height: .98; letter-spacing: -0.025em; }
.land-hero h1 em { font-style: normal; color: var(--accent-ink); }
.land-hero .lede { font-size: clamp(16px, 1.5vw, 19px); color: var(--ink-2); max-width: 34em; margin-top: 22px; }
.land-hero .ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
@media (max-width: 900px) { .land-hero { grid-template-columns: 1fr; } }
.engine { position: relative; background: var(--deep); color: var(--on-deep); border-radius: 24px; padding: 22px; overflow: hidden; box-shadow: var(--shadow-lg); min-width: 0; }
.engine svg.flow { display: block; width: 100%; height: auto; }
.engine .cap { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(233,250,247,.55); margin-bottom: 8px; }
.doors { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding-block: 10px 30px; }
@media (max-width: 800px) { .doors { grid-template-columns: 1fr; } }
.door { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; text-align: left; padding: 26px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); min-height: 220px; overflow: hidden; transition: transform .25s, box-shadow .25s, border-color .25s; }
.door:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--accent); }
.door h2 { font-size: 30px; font-weight: 800; margin-top: 8px; }
.door p { color: var(--ink-2); margin-top: 8px; max-width: 30em; }
.door .go { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: #032A3A; display: grid; place-items: center; transition: transform .25s; }
.door:hover .go { transform: translateX(4px); }
.door .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 18px; }
.door .steps span { font-size: 12px; font-weight: 650; color: var(--ink-2); border: 1px solid var(--line); padding: 3px 10px; border-radius: 999px; }
.loop { display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid var(--line); margin-block: 10px 40px; }
.loop div { padding: 18px 14px 0 0; }
.loop b { font: 800 15px var(--f-display); display: block; }
.loop span { font-size: 13px; color: var(--ink-2); }
.loop i { font-style: normal; font: 700 11px var(--f-body); color: var(--accent-ink); letter-spacing: .1em; display: block; margin-bottom: 6px; }
@media (max-width: 800px) { .loop { grid-template-columns: repeat(3, 1fr); row-gap: 10px; } }
.mission .bubbles { width: 92px; }
.mission { padding-block: 30px 60px; display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; color: var(--ink-2); }
.mission q { font: 800 clamp(22px, 2.6vw, 30px)/1.2 var(--f-display); color: var(--ink); quotes: none; }

/* ---------- Bubbles motif ---------- */
.bubbles circle { fill: var(--mint); opacity: .75; }
.bubbles circle.hi { fill: #18F0EC; opacity: 1; }
.waves-bg { position: absolute; inset: auto 0 0 0; height: 120px; pointer-events: none; opacity: .5; }
.waves-bg path { fill: var(--accent-soft); }

/* ---------- Onboarding ---------- */
.ob { min-height: calc(100vh - 46px); display: grid; grid-template-rows: auto 1fr auto; }
.ob > .wrap, .ob-foot > .wrap { width: 100%; }
.ob-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 18px; }
.ob-progress { display: flex; gap: 6px; }
.ob-progress span { width: 36px; height: 5px; border-radius: 3px; background: var(--line); transition: background .3s; }
.ob-progress span.on { background: var(--accent); }
.ob-body { padding-block: 10px 30px; }
.ob-body h1 { font-size: clamp(32px, 4.4vw, 54px); font-weight: 800; line-height: 1.02; letter-spacing: -.02em; max-width: 16ch; }
.ob-body .sub { color: var(--ink-2); font-size: 17px; margin-top: 12px; max-width: 40em; }
.interest-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-top: 30px; }
@media (max-width: 1000px) { .interest-grid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 600px) { .interest-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
.itile { position: relative; aspect-ratio: 1 / 1.08; border-radius: 18px; overflow: hidden; text-align: left; transition: transform .2s; isolation: isolate; }
.itile .poster { position: absolute; inset: 0; width: 100%; height: 100%; }
.itile::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(2,20,30,.7)); z-index: 1; }
.itile .lbl { position: absolute; z-index: 2; left: 12px; right: 12px; bottom: 11px; color: #fff; }
.itile .lbl b { font: 800 17px/1.1 var(--f-display); display: block; }
.itile .lbl small { font-size: 12px; opacity: .8; }
.itile .tick { position: absolute; z-index: 2; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,.8); display: grid; place-items: center; color: #032A3A; transition: all .2s; }
.itile .tick svg { width: 14px; height: 14px; opacity: 0; }
.itile.on { transform: scale(.96); box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--accent); }
.itile.on .tick { background: var(--mint); border-color: var(--mint); }
.itile.on .tick svg { opacity: 1; }
.itile:hover:not(.on) { transform: translateY(-2px); }
.personas { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; font-size: 13.5px; }
.ob-foot { position: sticky; bottom: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-block: 14px; }
.ob-foot .in { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.pref-grid { display: grid; gap: 28px; margin-top: 30px; max-width: 860px; }
.pref h3 { font-size: 18px; font-weight: 750; margin-bottom: 12px; }
.opt-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.opt { text-align: left; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); transition: all .18s; }
.opt b { display: block; font-weight: 700; }
.opt span { font-size: 13px; color: var(--ink-2); }
.opt:hover { border-color: var(--accent); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.tuning { display: grid; place-items: center; text-align: center; padding-block: 60px; }
.tuning h1 { max-width: none; }
.tuning .orbit { position: relative; width: 260px; height: 260px; margin: 0 auto 28px; }
.tuning .orbit .core { position: absolute; inset: 0; display: grid; place-items: center; }
.tuning .orbit .chip { position: absolute; animation: orbitIn .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes orbitIn { from { opacity: 0; transform: translate(var(--fx), var(--fy)) scale(.6); } to { opacity: 1; transform: none; } }
.tuning .bar { width: 240px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin: 22px auto 0; }
.tuning .bar i { display: block; height: 100%; background: var(--accent); animation: fill 1.9s ease forwards; }
@keyframes fill { from { width: 0 } to { width: 100% } }

/* ---------- Feed ---------- */
.greet { padding-block: 30px 6px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.greet h1 { font-size: clamp(30px, 3.6vw, 44px); font-weight: 800; letter-spacing: -.02em; }
.greet .tuned { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: 13.5px; color: var(--ink-2); }
.hero { display: grid; grid-template-columns: 1.55fr 1fr; gap: 20px; margin-top: 20px; }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; } }
.hero-main { position: relative; border-radius: 22px; overflow: hidden; min-height: 440px; display: flex; align-items: flex-end; text-align: left; isolation: isolate; color: #fff; }
.hero-main .poster, .hero-main img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
.hero-main:hover .poster { transform: scale(1.03); }
.hero-main::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(2,22,32,0) 30%, rgba(2,22,32,.82)); }
.hero-main .body { padding: clamp(20px, 3vw, 34px); max-width: 640px; }
.hero-main .kicker { display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; font-weight: 700; background: rgba(255,255,255,.16); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 999px; }
.hero-main h2 { font-size: clamp(30px, 3.8vw, 48px); font-weight: 800; line-height: 1.02; margin-top: 14px; letter-spacing: -.02em; }
.hero-main p { margin-top: 10px; opacity: .88; font-size: 15.5px; max-width: 46ch; }
.hero-main .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.hero-main .btn-ghost { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.35); color: #fff; backdrop-filter: blur(6px); }
.hero-side { display: grid; grid-template-rows: auto 1fr; gap: 20px; min-width: 0; }
.plan-card { border-radius: 22px; background: var(--deep); color: var(--on-deep); padding: 22px; position: relative; overflow: hidden; }
.plan-card h3 { font-size: 20px; font-weight: 800; color: #fff; }
.plan-card .eyebrow { color: var(--mint); }
.plan-card .empty { margin-top: 8px; color: rgba(233,250,247,.7); font-size: 14px; }
.plan-card .bubbles { position: absolute; right: -6px; bottom: -10px; width: 110px; opacity: .55; }
.plan-item { display: flex; gap: 12px; align-items: center; margin-top: 14px; }
.plan-item .when { width: 50px; text-align: center; background: rgba(255,255,255,.1); border-radius: 10px; padding: 6px 0; line-height: 1.05; }
.plan-item .when b { font: 800 16px var(--f-display); display: block; color: #fff; }
.plan-item .when small { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: rgba(233,250,247,.7); }
.plan-item .t { font-weight: 700; color: #fff; font-size: 14.5px; }
.plan-item .s { font-size: 12.5px; color: rgba(233,250,247,.7); }
.mini-list { display: grid; gap: 14px; align-content: start; }
.mini { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; text-align: left; }
.mini .media { aspect-ratio: 1; border-radius: 12px; }
.mini h4 { font: 750 15px/1.25 var(--f-body); letter-spacing: 0; }
.mini .meta { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }

.trend-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 36px; counter-reset: tr; }
@media (max-width: 760px) { .trend-list { grid-template-columns: 1fr; } }
.trend { display: grid; grid-template-columns: 38px 72px 1fr auto; gap: 14px; align-items: center; padding-block: 12px; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; }
.trend .rank { font: 800 26px var(--f-display); color: var(--ink-3); }
.trend .media { aspect-ratio: 1; border-radius: 10px; }
.trend h4 { font: 700 15px/1.3 var(--f-body); letter-spacing: 0; }
.trend .meta { font-size: 12.5px; color: var(--ink-2); }
.trend .up { font-size: 12.5px; font-weight: 700; color: var(--good); white-space: nowrap; }

.near-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .near-grid { grid-template-columns: 1fr; } }
.mapcard { position: relative; border-radius: 20px; overflow: hidden; background: var(--bg-2); min-height: 340px; border: 1px solid var(--line); }
.mapcard svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mapcard .pin { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform .2s; z-index: 2; }
.mapcard .pin:hover { transform: translate(-50%, -104%) scale(1.06); z-index: 3; }
.mapcard .pin .mono { width: 34px; height: 34px; border-radius: 11px; font-size: 11px; box-shadow: 0 0 0 3px var(--surface), var(--shadow); }
.mapcard .pin .lab { margin-top: 6px; background: var(--surface); padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; box-shadow: var(--shadow); white-space: nowrap; }
.mapcard .you { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #3B82F6; box-shadow: 0 0 0 5px rgba(59,130,246,.25); transform: translate(-50%,-50%); }
.mapcard .legend { position: absolute; left: 14px; bottom: 12px; font-size: 12px; font-weight: 650; background: var(--surface); padding: 5px 10px; border-radius: 999px; box-shadow: var(--shadow); }
.near-list { display: grid; gap: 4px; align-content: start; }
.near-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 10px; border-radius: 14px; text-align: left; transition: background .2s; }
.near-row:hover { background: var(--surface); }
.near-row .media { aspect-ratio: 1; border-radius: 12px; }
.near-row h4 { font: 700 15px/1.3 var(--f-body); letter-spacing: 0; }
.near-row .meta { font-size: 12.5px; color: var(--ink-2); }
.near-row .km { font-weight: 700; font-size: 13px; color: var(--ink-2); }

/* swipe deck */
.picks { display: grid; grid-template-columns: 1fr 1.1fr; gap: 30px; align-items: center; background: var(--deep); color: var(--on-deep); border-radius: 26px; padding: clamp(22px, 4vw, 44px); position: relative; overflow: hidden; }
@media (max-width: 860px) { .picks { grid-template-columns: 1fr; } }
.picks h2 { color: #fff; font-size: clamp(26px, 3vw, 36px); font-weight: 800; }
.picks .eyebrow { color: var(--mint); }
.picks p { color: rgba(233,250,247,.75); margin-top: 10px; max-width: 38ch; }
.picks .tally { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.picks .tally .chip { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); color: #fff; }
.stack { position: relative; height: 380px; max-width: 360px; width: 100%; margin: 0 auto; }
.scard { position: absolute; inset: 0 0 56px 0; border-radius: 20px; overflow: hidden; background: #0A3A50; box-shadow: 0 20px 40px -16px rgba(0,0,0,.5); transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s; touch-action: pan-y; user-select: none; cursor: grab; }
.scard .poster { position: absolute; inset: 0; width: 100%; height: 100%; }
.scard::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(2,20,30,.85)); }
.scard .info { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 2; color: #fff; }
.scard .info h3 { font-size: 22px; font-weight: 800; line-height: 1.1; }
.scard .info .m { font-size: 13px; opacity: .85; margin-top: 6px; }
.scard .stamp { position: absolute; top: 20px; z-index: 3; font: 800 18px var(--f-display); letter-spacing: .08em; padding: 6px 12px; border: 3px solid; border-radius: 10px; opacity: 0; transition: opacity .1s; }
.scard .stamp.keep { left: 18px; color: var(--mint); transform: rotate(-10deg); }
.scard .stamp.skip { right: 18px; color: #FF8A7A; transform: rotate(10deg); }
.stack .ctrl { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 16px; }
.stack .ctrl button { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.2); transition: all .2s; }
.stack .ctrl button:hover { background: rgba(255,255,255,.2); }
.stack .ctrl button.keep { background: var(--mint); color: #032A3A; border-color: var(--mint); }
.stack .ctrl svg { width: 20px; height: 20px; }
.stack .done { position: absolute; inset: 0 0 56px; display: grid; place-items: center; text-align: center; border: 2px dashed rgba(255,255,255,.25); border-radius: 20px; padding: 20px; }

.cat-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
@media (max-width: 900px) { .cat-strip { grid-template-columns: repeat(3, 1fr); } }
.cat-strip .itile { aspect-ratio: 1.3; }

.serendip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
@media (max-width: 860px) { .serendip { grid-template-columns: 1fr; } }

/* ---------- Detail ---------- */
.detail { padding-block: 22px 60px; }
.back { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; font-size: 14px; color: var(--ink-2); padding: 6px 0; }
.back:hover { color: var(--ink); }
.back svg { width: 16px; height: 16px; }
.det-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: clamp(24px, 4vw, 56px); margin-top: 14px; align-items: start; }
@media (max-width: 900px) { .det-grid { grid-template-columns: 1fr; } }
.det-media { aspect-ratio: 4 / 3; border-radius: 22px; }
.det-media .play.big { width: 72px; height: 72px; left: 50%; top: 50%; right: auto; bottom: auto; transform: translate(-50%, -50%); }
.det-media .play.big svg { width: 26px; height: 26px; }
.player { position: absolute; inset: auto 0 0 0; z-index: 3; padding: 14px 16px; background: linear-gradient(transparent, rgba(0,0,0,.6)); color: #fff; display: flex; align-items: center; gap: 12px; font-size: 12.5px; }
.player .track { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
.player .track i { display: block; height: 100%; background: var(--mint); width: 0; }
.det-info h1 { font-size: clamp(30px, 3.4vw, 44px); font-weight: 800; line-height: 1.05; letter-spacing: -.02em; margin-top: 10px; }
.det-biz { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%; transition: border-color .2s; }
.det-biz:hover { border-color: var(--accent); }
.det-biz .n { font-weight: 750; }
.det-biz .k { font-size: 13px; color: var(--ink-2); }
.det-biz .arrow { margin-left: auto; color: var(--ink-3); }
.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-top: 18px; }
.facts div { background: var(--surface); padding: 12px 14px; }
.facts small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.facts b { font-weight: 650; font-size: 14.5px; }
.det-desc { margin-top: 20px; font-size: 16.5px; line-height: 1.6; max-width: 62ch; }
.cta-row { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; align-items: center; }
.cta-row .btn-primary { flex: 1; min-width: 200px; }
.why { margin-top: 22px; padding: 16px; border-radius: 14px; background: var(--accent-soft); }
.why h4 { font: 750 14px var(--f-body); letter-spacing: 0; display: flex; gap: 8px; align-items: center; }
.why h4 svg { width: 16px; height: 16px; color: var(--accent-ink); }
.why ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); }
.why .why-foot { display: flex; gap: 14px; margin-top: 10px; font-size: 13px; }
.why .why-foot button { color: var(--accent-ink); font-weight: 650; }
.article-body { margin-top: 18px; font-size: 16px; line-height: 1.7; max-width: 62ch; display: grid; gap: 14px; border-top: 1px solid var(--line); padding-top: 18px; }
.offer { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 14px; font-weight: 650; color: var(--accent-ink); }
.offer svg { width: 18px; height: 18px; }

/* ---------- Business profile (member) ---------- */
.bp-cover { position: relative; height: clamp(200px, 26vw, 320px); border-radius: 0 0 26px 26px; overflow: hidden; }
.bp-cover .poster { position: absolute; inset: 0; width: 100%; height: 100%; }
.back.on-cover { color: #fff; background: rgba(3,30,42,.4); backdrop-filter: blur(6px); padding: 6px 12px; border-radius: 999px; }
a.btn { text-decoration: none; color: var(--ink); }
.bp-head { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: end; margin-top: -32px; position: relative; }
@media (max-width: 760px) { .bp-head { grid-template-columns: auto 1fr; } .bp-head .bp-act { grid-column: 1 / -1; } }
.bp-head h1 { font-size: clamp(28px, 3.4vw, 42px); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.bp-head .k { color: var(--ink-2); margin-top: 4px; font-size: 14.5px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.bp-act { display: flex; gap: 10px; }
.stars { color: var(--sun); letter-spacing: 1px; }
.bp-grid { display: grid; grid-template-columns: 1fr 340px; gap: 40px; margin-top: 30px; align-items: start; }
@media (max-width: 980px) { .bp-grid { grid-template-columns: 1fr; } }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { padding: 12px 16px; font-weight: 650; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.tab-panel { padding-top: 22px; }
.sched { display: grid; gap: 8px; }
.sched-row { display: grid; grid-template-columns: 70px 80px 1fr auto auto; gap: 14px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.sched-row .d { font: 800 15px var(--f-display); }
.sched-row .t { color: var(--ink-2); font-size: 14px; }
.sched-row .n { font-weight: 650; }
.sched-row .sp { font-size: 12.5px; color: var(--ink-2); }
.sched-row .sp.low { color: var(--coral); font-weight: 650; }
@media (max-width: 640px) { .sched-row { grid-template-columns: 56px 1fr auto; } .sched-row .t { grid-column: 2; grid-row: 2; } .sched-row .sp { display: none; } .sched-row .n { grid-column: 2; grid-row: 1; } }
.side-card { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 20px; display: grid; gap: 14px; }
.side-card h3 { font-size: 16px; font-weight: 800; }
.team { display: grid; gap: 12px; }
.person { display: flex; gap: 12px; align-items: center; }
.person .avatar { width: 42px; height: 42px; font-size: 13px; }
.person b { display: block; font-size: 14.5px; }
.person span { font-size: 12.5px; color: var(--ink-2); }
.quote { border-left: 3px solid var(--accent); padding-left: 14px; font-size: 15px; }
.quote cite { display: block; margin-top: 6px; font-size: 12.5px; font-style: normal; color: var(--ink-3); font-weight: 650; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
@media (max-width: 1000px) { .grid-4 { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 760px) { .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); gap: 14px; } }
@media (max-width: 440px) { .grid-3, .grid-4 { grid-template-columns: 1fr; } }

/* ---------- Explore ---------- */
.ex-head { padding-block: 30px 10px; }
.ex-head h1 { font-size: clamp(32px, 4vw, 50px); font-weight: 800; letter-spacing: -.02em; }
.ex-cats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-top: 22px; }
@media (max-width: 1000px) { .ex-cats { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 600px) { .ex-cats { grid-template-columns: repeat(2, 1fr); } }
.ex-cats .itile { aspect-ratio: 1.15; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 18px; position: sticky; top: calc(66px + env(safe-area-inset-top, 0px)); z-index: 10; background: var(--bg); }
@media (max-width: 760px) { .filters { top: calc(58px + env(safe-area-inset-top, 0px)); } }
.filters .sep { width: 1px; height: 22px; background: var(--line-2); margin-inline: 4px; }
.collections { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 900px) { .collections { grid-template-columns: repeat(2, 1fr); } }
.coll { text-align: left; padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 14px; transition: border-color .2s, transform .2s; }
.coll:hover { border-color: var(--accent); transform: translateY(-2px); }
.coll .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.coll .thumbs .media { aspect-ratio: 1; border-radius: 10px; }
.coll b { font: 800 17px var(--f-display); }
.coll span { font-size: 13px; color: var(--ink-2); }
.empty-state { padding: 50px 20px; text-align: center; color: var(--ink-2); border: 1.5px dashed var(--line-2); border-radius: 18px; }
.empty-state h3 { color: var(--ink); font-size: 20px; margin-bottom: 6px; }

/* ---------- Search overlay ---------- */
.overlay { position: fixed; inset: 0; z-index: 80; background: rgba(2,24,34,.5); backdrop-filter: blur(6px); display: grid; place-items: start center; padding: calc(70px + env(safe-area-inset-top, 0px)) 16px 16px; animation: fadeIn .18s; }
@keyframes fadeIn { from { opacity: 0 } }
.search-box { width: min(720px, 100%); background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-lg); overflow: hidden; animation: rise .22s cubic-bezier(.2,.8,.2,1); max-height: calc(100vh - 100px); display: flex; flex-direction: column; }
@keyframes rise { from { transform: translateY(12px); opacity: 0 } }
.search-box .field { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.search-box .field svg { width: 20px; height: 20px; color: var(--ink-3); }
.search-box input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 18px; min-width: 0; }
.search-box .results { overflow-y: auto; padding: 8px 10px 14px; }
.sr-group { padding: 10px 10px 4px; }
.sr-group h5 { font: 700 11px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
.sr { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 8px; border-radius: 12px; width: 100%; text-align: left; }
.sr:hover, .sr.active { background: var(--bg-2); }
.sr .media { width: 44px; height: 44px; border-radius: 10px; }
.sr b { font-weight: 650; font-size: 14.5px; display: block; }
.sr small { font-size: 12.5px; color: var(--ink-2); }
.sr mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.sr .avatar { width: 44px; height: 44px; }

/* ---------- Sheet / modal ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 90; background: rgba(2,24,34,.55); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; animation: fadeIn .18s; }
.sheet { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-lg); animation: rise .25s cubic-bezier(.2,.8,.2,1); }
.sheet .s-head { position: relative; height: 130px; overflow: hidden; }
.sheet .s-head .poster { position: absolute; inset: 0; width: 100%; height: 100%; }
.sheet .s-head .close { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.9); color: #082A38; border: 0; }
.sheet .s-body { padding: 22px; display: grid; gap: 16px; }
.sheet h3 { font-size: 22px; font-weight: 800; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.slot { padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); text-align: left; transition: all .15s; }
.slot b { display: block; font-size: 14px; }
.slot small { font-size: 12px; color: var(--ink-2); }
.slot.on { border-color: var(--accent); background: var(--accent-soft); }
.field-l { display: grid; gap: 6px; }
.field-l label, .lbl-s { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.inp { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); outline: 0; transition: border-color .2s; font-size: 15px; }
.inp:focus { border-color: var(--accent); }
textarea.inp { resize: vertical; min-height: 92px; line-height: 1.5; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
.success { text-align: center; padding: 30px 22px 26px; display: grid; gap: 10px; justify-items: center; }
.success .ok { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #032A3A; display: grid; place-items: center; animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
.success .ok svg { width: 30px; height: 30px; }
@keyframes pop { from { transform: scale(.4) } }

/* ---------- Toast ---------- */
.toasts { position: fixed; z-index: 120; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
@media (max-width: 760px) { .toasts { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); } }
.toast { background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow-lg); display: flex; gap: 12px; align-items: center; pointer-events: auto; animation: rise .25s; }
.toast button { color: var(--accent); font-weight: 750; }

/* ---------- Saved & You ---------- */
.page-head { padding-block: 30px 18px; }
.page-head h1 { font-size: clamp(30px, 3.6vw, 44px); font-weight: 800; letter-spacing: -.02em; }
.you-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return Math.abs(h); }
function rng(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; }

function wavePath(w, y, amp, len, phase) {
  let d = `M -20 ${y}`;
  for (let x = -20; x <= w + 40; x += len) {
    d += ` Q ${x + len / 4 + phase} ${y - amp} ${x + len / 2 + phase} ${y} T ${x + len + phase} ${y}`;
  }
  return d;
}

/* poster(seed, cat, opts) -> SVG string, 400x300 viewBox, scales to fill */
function poster(seed, cat, opts = {}) {
  const [deep, bright] = PALETTES[cat] || PALETTES.running;
  const r = rng(hashStr(seed + cat));
  const W = opts.wide ? 1000 : 400, H = opts.tall ? 500 : 300;
  const id = 'p' + hashStr(seed).toString(36);
  const ang = Math.round(r() * 60 + 20);
  // waves
  let waves = '';
  const bands = 3;
  for (let i = 0; i < bands; i++) {
    const y = H * (0.35 + i * 0.22) + r() * 30;
    const amp = 18 + r() * 26;
    const len = 150 + r() * 110;
    const ph = r() * 80;
    const op = (0.12 + i * 0.09).toFixed(2);
    waves += `<path d="${wavePath(W, y, amp, len, ph)} L ${W + 40} ${H + 20} L -20 ${H + 20} Z" fill="${bright}" opacity="${op}"/>`;
  }
  // bubbles
  let bubbles = '';
  const cx = r() < 0.5 ? 40 + r() * 90 : W - 130 + r() * 90, cy = 30 + r() * 60;
  const sizes = [11, 7, 5, 4, 3, 2.5];
  sizes.forEach((s, i) => {
    const bx = cx + Math.cos(i * 1.9 + r()) * (12 + i * 7), by = cy + Math.sin(i * 1.9 + r()) * (10 + i * 6);
    bubbles += `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${s}" fill="${bright}" opacity="${(0.55 + r() * 0.35).toFixed(2)}"/>`;
  });
  // glyph
  const gs = (opts.tall ? 2.1 : 1.45) + r() * 0.3;
  const gx = W * (opts.wide ? 0.78 : 0.52 + (r() - 0.5) * 0.22) - 50 * gs, gy = H * (opts.tall ? 0.4 : 0.4) - 50 * gs + (r() - 0.5) * 16;
  const glyph = `<g transform="translate(${gx.toFixed(1)} ${gy.toFixed(1)}) scale(${gs.toFixed(2)})" fill="none" stroke="#fff" stroke-opacity=".94" stroke-width="${(6 / gs * 1.4).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round">${GLYPHS[cat] || GLYPHS.running}</g>`;
  return `<svg class="poster" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<defs><linearGradient id="${id}" gradientTransform="rotate(${ang} .5 .5)"><stop offset="0" stop-color="${deep}"/><stop offset="1" stop-color="${mix(deep, bright, 0.45)}"/></linearGradient></defs>
<rect width="${W}" height="${H}" fill="url(#${id})"/>${waves}${bubbles}${glyph}</svg>`;
}

function mix(a, b, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, '') + 'k' : n.toLocaleString('en-CA');

/* ---------------- State ---------------- */
const STORE_KEY = 'memo-prototype-v1';
function freshState() {
  return {
    mode: 'landing',            // landing | member | business
    route: { name: 'landing', params: {} },
    stack: [],
    user: { name: 'Jordan', onboarded: false, interests: [], level: 'some', setting: 'mix', company: 'either', time: 'mid', account: false, email: 'jordan.lee@example.com' },
    ob: { step: 0, draft: { interests: [], level: 'some', setting: 'mix', company: 'either', time: 'mid' } },
    saved: [], following: [], plans: [], hidden: [], swiped: [], boosts: {}, watched: [],
    privacy: { personalize: true, location: true, shareWithBiz: true },
    explore: { cat: null, coll: null, types: [], setting: null, beginner: false, sort: 'match' },
    published: [],              // items uploaded in the business demo
    bizEdits: {},               // item overrides from the business side (tags, status)
    biz: { onboarded: false, step: 0, plan: 'basic', account: { name: 'Ringside Kitsilano', email: 'hello@ringsidekits.ca' }, picked: ['IMG_4021.MOV', 'insta_reel_0312.mp4', 'class schedule FALL final v3.pdf', 'saturday open gym poster.png'], recDone: [], period: 30, libFilter: 'all', libQuery: '', dim: 'activity', confirmed: [], profile: null, earned: 186 },
    up: null,
  };
}
let state = freshState();
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const s = JSON.parse(raw); state = Object.assign(freshState(), s); state.biz = Object.assign(freshState().biz, s.biz || {}); state.user = Object.assign(freshState().user, s.user || {}); } } catch (e) { /* storage unavailable */ }
}
function save() {
  try {
    const copy = { ...state, up: null, published: state.published.map(p => (p.img && p.img.length > 1500000) ? { ...p, img: null } : p) };
    localStorage.setItem(STORE_KEY, JSON.stringify(copy));
  } catch (e) { /* storage full or blocked; demo still works in memory */ }
}

/* ---------------- Items ---------------- */
function allItems() {
  const base = [...ITEMS, ...DRAFTS, ...state.published];
  return base.map(it => state.bizEdits[it.id] ? { ...it, ...state.bizEdits[it.id] } : it);
}
function liveItems() { return allItems().filter(i => (i.status || 'live') === 'live'); }
function item(id) { return allItems().find(i => i.id === id); }
function biz(id) {
  const b = BUSINESSES[id];
  if (id === 'ringside' && state.biz.profile) return { ...b, ...state.biz.profile };
  return b;
}

/* ---------------- Personalization ---------------- */
function score(it) {
  const u = state.user; let s = 0;
  if (!state.privacy.personalize) return it.trend + it.views / 20000;
  it.cats.forEach((c, i) => { if (u.interests.includes(c)) s += i === 0 ? 5 : 2.5; s += (state.boosts[c] || 0) * 1.4; });
  if (u.company === 'social' && it.social === 'group') s += 1.6;
  if (u.company === 'solo' && it.social === 'solo') s += 1.6;
  if (u.setting === 'outdoors' && it.setting === 'outdoor') s += 2.2;
  if (u.setting === 'outdoors' && it.setting === 'indoor') s -= .6;
  if (u.setting === 'indoors' && it.setting === 'indoor') s += 1.2;
  if (u.setting === 'home' && it.setting === 'online') s += 2.2;
  if (u.level === 'new' && it.level === 'beginner') s += 2.2;
  if (u.level === 'new' && it.level === 'intermediate') s -= 2;
  if (u.level === 'regular' && it.level === 'intermediate') s += 1.2;
  if (u.time === 'short' && it.dur && it.dur <= 20) s += 1.2;
  if (u.time === 'long' && it.dur >= 60) s += 1;
  if (it.isNew) s += 1.5;
  s += it.trend * 0.12;
  if (state.hidden.includes(it.id)) s -= 100;
  return s;
}
function ranked(list = liveItems()) { return list.map(i => [i, score(i)]).sort((a, b) => b[1] - a[1]).map(x => x[0]); }
function distOf(it) { const b = biz(it.biz); return it.setting === 'online' ? null : b.dist; }
function reasons(it) {
  const u = state.user, r = [];
  it.cats.forEach(c => { if (u.interests.includes(c)) r.push(CAT[c].name); });
  if ((state.boosts[it.cats[0]] || 0) > 0 && !u.interests.includes(it.cats[0])) r.push('You kept similar picks');
  if (u.level === 'new' && it.level === 'beginner') r.push('Beginner-friendly');
  if (u.setting === 'outdoors' && it.setting === 'outdoor') r.push('Outdoors');
  if (u.setting === 'home' && it.setting === 'online') r.push('At home');
  if (u.company === 'social' && it.social === 'group') r.push('With people');
  const d = distOf(it); if (d !== null && d < 1.5) r.push(`${d} km away`);
  return r;
}

/* ---------------- Router ---------------- */
function go(name, params = {}, opts = {}) {
  if (!opts.replace && state.route) state.stack.push(state.route);
  if (state.stack.length > 40) state.stack.shift();
  state.route = { name, params };
  if (name.startsWith('u/')) state.mode = 'member';
  else if (name.startsWith('b/')) state.mode = 'business';
  else state.mode = 'landing';
  closeLayer();
  render();
  if (!opts.keepScroll) window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  save();
}
function back(fallback = 'u/home') {
  const prev = state.stack.pop();
  if (prev) { state.route = prev; state.mode = prev.name.startsWith('u/') ? 'member' : prev.name.startsWith('b/') ? 'business' : 'landing'; render(); window.scrollTo(0, 0); }
  else go(fallback, {}, { replace: true });
}
function switchMode(mode) {
  if (mode === 'member') go(state.user.onboarded ? 'u/home' : 'u/onboard');
  else if (mode === 'business') go(state.biz.onboarded ? 'b/overview' : 'b/start');
  else go('landing');
}

/* ---------------- Layers: overlays, sheets, toasts ---------------- */
function openLayer(html) { const l = $('#layer'); l.innerHTML = html; document.body.style.overflow = 'hidden'; const f = l.querySelector('[autofocus]'); if (f) setTimeout(() => f.focus(), 30); }
function closeLayer() { const l = $('#layer'); if (l) l.innerHTML = ''; document.body.style.overflow = ''; }
function toast(msg, action) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${msg}</span>` + (action ? `<button data-act="${action.act}" ${Object.entries(action.data || {}).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ')}>${action.label}</button>` : '');
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3600);
}

function media(it, opts = {}) {

}

const MAP_POS = { ringside: [47, 60], stillwater: [55, 44], tideline: [40, 36], pitch: [31, 52], coastline: [70, 58], goodfuel: [62, 74], spoke: [80, 40], saltwater: [92, 62], formflow: [88, 22] };

/* ---------------- Quick picks (swipe) ---------------- */
function picksPool() {
  const u = state.user;
  return ranked(liveItems().filter(i => !state.swiped.includes(i.id) && !state.saved.includes(i.id) && !state.hidden.includes(i.id)))
    .filter((it, idx) => idx % 3 === 1 || !it.cats.some(c => u.interests.includes(c))).slice(0, 5);
}
function picksSection() {
  const pool = picksPool();
  const kept = Object.entries(state.boosts).filter(([, v]) => v > 0).map(([k]) => CAT[k].name);
  const done = state.swiped.length;
  return `<div class="picks">
    <div>
      <span class="eyebrow">Quick picks</span>
      <h2 style="margin-top:8px">Keep or skip. Your feed learns as you go.</h2>
      <p>Drag a card, use the buttons, or your arrow keys. Kept picks are saved and nudge similar things up your feed.</p>
      <div class="tally">${done ? `<span class="chip num">${done} sorted</span>` : ''}${kept.slice(0, 4).map(k => `<span class="chip">+ ${k}</span>`).join('')}</div>
    </div>
    <div class="stack" id="stack">
      ${pool.length ? pool.slice(0, 3).reverse().map((it, i, arr) => { const depth = arr.length - 1 - i; return `<div class="scard" data-id="${it.id}" style="transform:translateY(${depth * 10}px) scale(${1 - depth * .04});z-index:${10 - depth};${depth ? 'pointer-events:none;' : ''}">${it.img ? `<img src="${it.img}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">` : poster(it.id + 'sw', it.cats[0], { tall: true })}<span class="stamp keep">KEEP</span><span class="stamp skip">SKIP</span><div class="info"><span class="pill" style="background:rgba(255,255,255,.18);color:#fff">${TYPES[it.type].label} · ${esc(biz(it.biz).name)}</span><h3 style="margin-top:8px">${esc(it.title)}</h3><div class="m">${esc(it.when)}</div></div></div>`; }).join('')
      : `<div class="done"><div><h3 style="color:#fff;font-size:22px">All sorted</h3><p style="margin:8px auto 14px">Your feed has been re-ranked.</p><button class="btn btn-primary btn-sm" data-act="picks-reset">Show me more</button></div></div>`}
      <div class="ctrl"><button data-act="swipe" data-dir="skip" aria-label="Skip">${ic('x')}</button><button data-act="open-top" aria-label="Details">${ic('eye')}</button><button class="keep" data-act="swipe" data-dir="keep" aria-label="Keep">${ic('check')}</button></div>
    </div>
  </div>`;
}
function swipeTop(dir) {
  const top = $$('#stack .scard').pop(); if (!top) return;
  const id = top.dataset.id; const it = item(id);
  top.style.transform = `translateX(${dir === 'keep' ? 420 : -420}px) rotate(${dir === 'keep' ? 18 : -18}deg)`; top.style.opacity = '0';
  state.swiped.push(id);
  if (dir === 'keep') { it.cats.forEach(c => state.boosts[c] = (state.boosts[c] || 0) + 1); if (!state.saved.includes(id)) state.saved.push(id); }
  else { state.boosts[it.cats[0]] = (state.boosts[it.cats[0]] || 0) - 0.3; }
  save();
  setTimeout(() => { const w = $('#picks-wrap'); if (w) { w.innerHTML = picksSection(); bindSwipe(); } }, 260);
}
function bindSwipe() {
  const top = $$('#stack .scard').pop(); if (!top) return;
  let sx = 0, dx = 0, drag = false;
  top.addEventListener('pointerdown', e => { drag = true; sx = e.clientX; dx = 0; top.setPointerCapture(e.pointerId); top.style.transition = 'none'; });
  top.addEventListener('pointermove', e => { if (!drag) return; dx = e.clientX - sx; top.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; top.querySelector('.keep').style.opacity = Math.max(0, dx / 100); top.querySelector('.skip').style.opacity = Math.max(0, -dx / 100); });
  const end = () => { if (!drag) return; drag = false; top.style.transition = ''; if (Math.abs(dx) > 90) swipeTop(dx > 0 ? 'keep' : 'skip'); else if (Math.abs(dx) < 5) openItem(top.dataset.id); else { top.style.transform = ''; $$('.stamp', top).forEach(s => s.style.opacity = 0); } };
  top.addEventListener('pointerup', end); top.addEventListener('pointercancel', end);
}

/* ---------------- CTA sheets ---------------- */
function slotsFor(it) {
  const b = biz(it.biz);
  const rows = (b.schedule || []).filter(s => s.item === it.id);
  const base = new Date(2026, 9, 6);
  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const out = [];
  if (rows.length) {
    for (let i = 1; i <= 14 && out.length < 6; i++) {
      const dt = new Date(base); dt.setDate(base.getDate() + i);
      rows.forEach(r => { if ((r.day === days[dt.getDay()] || r.day === 'Daily' || (r.day.includes('–') && dt.getDay() > 0)) && out.length < 6) out.push({ day: dt.getDate(), mon: 'Oct', dow: days[dt.getDay()], time: r.time, spots: r.spots - (i % 3) }); });
    }
  }
  if (!out.length) {
    const m = /([A-Z][a-z]{2}), ([A-Z][a-z]{2}) (\d{1,2})/.exec(it.when || '');
    const tm = /(\d{1,2}:\d{2} [ap]m)/.exec(it.when || '');
    if (m) out.push({ day: +m[3], mon: m[2], dow: m[1], time: tm ? tm[1] : '', spots: 12 });
    else [8, 9, 10].forEach((dd, i) => out.push({ day: dd, mon: 'Oct', dow: days[(4 + i) % 7], time: tm ? tm[1] : ['10:00 am', '2:00 pm', '6:00 pm'][i], spots: 8 }));
  }
  return out;
}

}
function lineChart() {
  const { views, saves } = BIZ_SERIES; const W = 640, H = 220, L = 40, R = 10, T = 10, Bt = 26;
  const max = 1000; const x = i => L + i / (views.length - 1) * (W - L - R); const y = v => T + (1 - v / max) * (H - T - Bt);
  const vp = views.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const sp = saves.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  let grid = ''; [0, 250, 500, 750, 1000].forEach(v => grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v ? '3 4' : ''}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v ? fmt(v) : '0'}</text>`);
  const labels = [[0, 'Sep 7'], [7, 'Sep 14'], [14, 'Sep 21'], [21, 'Sep 28'], [29, 'Oct 6']].map(([i, l]) => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === 29 ? 'end' : 'middle'}">${l}</text>`).join('');
  const last = views.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily views and saves over the last 30 days">${grid}${labels}
    <path d="${vp} L${x(last)} ${y(0)} L${x(0)} ${y(0)} Z" fill="var(--accent)" opacity=".14"/>
    <path d="${vp}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="${sp}" fill="none" stroke="var(--coral)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(last)}" cy="${y(views[last])}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${x(last) - 10}" y="${y(views[last]) - 10}" text-anchor="end" style="fill:var(--ink);font-weight:700">${views[last]} views today</text>
  </svg>`;
}

function suggest(up) {
  const text = `${up.title} ${up.desc} ${up.file ? up.file.name : ''}`;
  const out = { activity: [], level: [], goal: [], audience: [], location: [] };
  const add = (d, l, c) => { if (!out[d].find(x => x.l === l)) out[d].push({ l, c, on: true }); };
  KW.forEach(([re, d, l]) => { if (re.test(text)) add(d, l, 86 + (l.length % 10)); });
  if (!out.activity.length) add('activity', 'Boxing', 71);
  if (!out.level.length) add('level', 'All levels', 74);
  if (!out.audience.length) add('audience', 'Adults', 80);
  if (!out.goal.length) add('goal', 'Get moving', 70);
  add('location', 'Kitsilano', 99); add('location', 'Vancouver', 99);
  if (up.type === 'video' || up.type === 'article') add('location', 'At home', 90);
  // keep user toggles from previous suggestion
  if (up.tags) Object.keys(out).forEach(d => out[d].forEach(t => { const prev = (up.tags[d] || []).find(x => x.l === t.l); if (prev) t.on = prev.on; }));
  if (up.tags) Object.keys(up.tags).forEach(d => up.tags[d].filter(t => t.custom).forEach(t => out[d].push(t)));
  return out;
}

  it.cats.forEach(c => s.push([`Because you like ${CAT[c].name.toLowerCase()}`, 1850 - s.length * 300]));
  if (it.level === 'beginner') s.push(['Beginner-friendly picks', 1320]);
  if (it.setting === 'online') s.push(['At-home workouts', 1640]);
  if ((it.tags || []).includes('Meet people')) s.push(['Meet people while you move', 980]);
  s.push(['Your 3,412 followers', 3412]);
  return s.filter(x => x[1] > 0);
}

function publishUpload(asDraft) {
  const it = upItem(); it.id = 'pub-' + Date.now().toString(36);

/* Memo prototype — rendering, actions and boot */

const VIEWS = {
  'landing': viewLanding,
  'u/onboard': viewOnboard, 'u/home': viewHome, 'u/item': viewItem, 'u/biz': viewBiz, 'u/explore': viewExplore, 'u/saved': viewSaved, 'u/me': viewMe,
  'b/start': viewBizStart, 'b/onboard': viewBizOnboard, 'b/overview': viewBizOverview, 'b/content': viewBizContent, 'b/organize': viewBizOrganize, 'b/upload': viewBizUpload, 'b/profile': viewBizProfile, 'b/plan': viewBizPlan,
};
function render() {
  const r = state.route.name;
  if (r.startsWith('u/') && r !== 'u/onboard' && !state.user.onboarded) state.route = { name: 'u/onboard', params: {} };
  const v = VIEWS[state.route.name] || viewLanding;
  $('#app').innerHTML = demobar() + v();
  if (state.route.name === 'u/home') bindSwipe();
  if (state.route.name === 'b/upload') bindUpload();
  if (state.route.name === 'u/onboard' && state.ob.step === 2) {
    clearTimeout(window.__tune); window.__tune = setTimeout(() => { if (state.route.name === 'u/onboard' && state.ob.step === 2) finishOnboarding(); }, 2300);
  }
}

function setPersona(id) {
  const p = PERSONAS.find(x => x.id === id);
  Object.assign(state.user, { interests: [...p.interests], level: p.level, setting: p.setting, company: p.company, time: p.time, onboarded: true });
  state.ob.draft = { interests: [...p.interests], level: p.level, setting: p.setting, company: p.company, time: p.time };
  state.boosts = {}; state.swiped = []; state.hidden = [];
}

const A = {
  home: () => go('landing'),
  mode: d => switchMode(d.mode),
  reset: () => { try { localStorage.removeItem(STORE_KEY); } catch (e) { } state = freshState(); render(); window.scrollTo(0, 0); toast('Demo reset to a fresh start'); },
  go: d => { const p = {}; if (d.tab) p.tab = d.tab; go(d.to, p, { replace: !!d.replace, keepScroll: !!d.replace }); },
  back: () => back(state.mode === 'business' ? 'b/overview' : 'u/home'),
  scroll: d => { const el = document.getElementById(d.target); if (el) el.scrollBy({ left: +d.dir * el.clientWidth * .8, behavior: 'smooth' }); },

  /* onboarding */

  'ob-next': () => { state.ob.step++; render(); window.scrollTo(0, 0); },
  'ob-back': () => { state.ob.step--; render(); },
  'ob-opt': d => { state.ob.draft[d.key] = d.val; render(); },

  persona: d => { setPersona(d.id); state.ob.step = 2; render(); },
  'persona-live': d => { setPersona(d.id); go('u/home'); toast(`Now viewing as: ${PERSONAS.find(p => p.id === d.id).label}`); },
  'redo-ob': () => { state.ob = { step: 0, draft: { ...state.ob.draft, interests: [...state.user.interests] } }; state.user.onboarded = false; go('u/onboard'); },

  /* content */
  open: d => openItem(d.id),
  'open-top': () => { const t = $$('#stack .scard').pop(); if (t) openItem(t.dataset.id); },
  'open-biz': d => go('u/biz', { id: d.id }),
  'biz-tab': d => go('u/biz', { id: d.id, tab: d.tab }, { replace: true, keepScroll: true }),
  save: (d) => {

  },
  share: d => { const it = item(d.id); copyText(`${it.title} · ${biz(it.biz).name} on Memo`); },
  'share-biz': d => copyText(`${biz(d.id).name} on Memo`),
  follow: d => { const i = state.following.indexOf(d.id); i < 0 ? state.following.push(d.id) : state.following.splice(i, 1); save(); render(); toast(i < 0 ? `Following ${biz(d.id).name}. Their new content will show up first.` : `Unfollowed ${biz(d.id).name}`); },
  less: d => { state.hidden.push(d.id); const it = item(d.id); state.boosts[it.cats[0]] = (state.boosts[it.cats[0]] || 0) - 1; save(); toast('Got it. You’ll see less like this.', { label: 'Undo', act: 'undo-less', data: { id: d.id } }); back(); },

  'ex-coll': d => { state.explore = { ...state.explore, coll: d.id, cat: null }; go('u/explore'); },

  'set-plan': d => { if (state.biz.plan === d.id) return; state.biz.plan = d.id; save(); render(); toast(`Switched to ${PLANS.find(p => p.id === d.id).name}. Prototype: no charge.`); },

  /* business: upload */
  'up-sample': d => { const f = SAMPLE_FILES[+d.i]; newUpload({ name: f.file, size: f.size, kind: f.kind, guess: f.guess }); render(); window.scrollTo(0, 0); },
  'up-reset': () => { newUpload(); render(); },
  'up-again': () => { newUpload(); render(); window.scrollTo(0, 0); },
  'up-type': d => { state.up.type = d.t; render(); },
  'up-tag': d => { const t = state.up.tags[d.d][+d.i]; t.on = !t.on; refreshUploadPreview(); },
  'up-publish': () => publishUpload(false),
  'up-draft': () => publishUpload(true),

  /* business: profile */
  'pf-amen': (d, el) => { const b = Object.assign({}, biz('ringside')); const L = [...b.amenities]; const i = L.indexOf(d.a); i < 0 ? L.push(d.a) : L.splice(i, 1); state.biz.profile = { ...(state.biz.profile || {}), amenities: L }; el.classList.toggle('on'); $('#prof-preview').innerHTML = profPreview(biz('ringside')); },
  'pf-reset': () => { state.biz.profile = null; save(); render(); toast('Profile reset'); },
};

function rerenderKeep() { const y = window.scrollY; const f = document.activeElement && document.activeElement.id; render(); window.scrollTo(0, y); if (f) { const el = document.getElementById(f); if (el) { el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); } } save(); }

function copyText(t) {
  const done = () => toast('Link copied');
  try { navigator.clipboard.writeText(t).then(done, () => toast('Copy isn’t available here. Share from the address bar instead.')); } catch (e) { toast('Copy isn’t available here.'); }
}

function bindUpload() {
  const inp = $('#file-in'); const drop = $('#drop');
  const take = file => {
    if (!file) return;
    const kind = file.type.startsWith('image') ? 'image' : file.type.startsWith('video') ? 'video' : 'doc';
    const size = file.size > 1e6 ? (file.size / 1e6).toFixed(1) + ' MB' : Math.round(file.size / 1e3) + ' KB';
    const f = { name: file.name, size, kind };
    if (kind === 'image' && file.size < 12e6) {
      const r = new FileReader(); r.onload = () => { f.img = r.result; newUpload(f); render(); }; r.readAsDataURL(file);
    } else { newUpload(f); render(); }
  };
  if (inp) inp.addEventListener('change', () => take(inp.files[0]));
  if (drop) {
    ['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', ev => take(ev.dataTransfer.files[0]));
  }
}

/* ---------- Global events ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') return;
  if (el.dataset.act !== 'close-bg') ev.preventDefault();
  fn({ ...el.dataset }, el, ev);
});
document.addEventListener('keydown', ev => {
  const tag = (ev.target.tagName || '').toLowerCase();
  if (ev.key === 'Escape') { closeLayer(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('article[data-act]')) { ev.preventDefault(); A.open(ev.target.dataset); return; }
  if (tag === 'input' || tag === 'textarea' || tag === 'select') {
    if (ev.key === 'Enter' && ev.target.id === 'up-custom' && ev.target.value.trim()) { state.up.tags.goal.push({ l: ev.target.value.trim(), on: true, custom: true }); ev.target.value = ''; refreshUploadPreview(); }
    if (ev.key === 'Enter' && ev.target.id === 'q') { const first = $('#sr .sr'); if (first) first.click(); }
    return;
  }
  if (ev.key === '/' && state.mode === 'member' && state.user.onboarded) { ev.preventDefault(); openSearch(); }
  if (state.route.name === 'u/home' && !$('#layer').innerHTML) { if (ev.key === 'ArrowRight' && $('#stack .scard')) swipeTop('keep'); if (ev.key === 'ArrowLeft' && $('#stack .scard')) swipeTop('skip'); }
});
let upTimer;
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { $('#sr').innerHTML = searchResults(t.value); return; }
  if (t.dataset.up) { state.up[t.dataset.up] = t.value; clearTimeout(upTimer); upTimer = setTimeout(refreshUploadPreview, 220); return; }
  if (t.dataset.pf) { state.biz.profile = { ...(state.biz.profile || {}), [t.dataset.pf]: t.value }; $('#prof-preview').innerHTML = profPreview(biz('ringside')); return; }
  if (t.id === 'lib-q') { state.biz.libQuery = t.value; clearTimeout(upTimer); upTimer = setTimeout(rerenderKeep, 150); }
});
document.addEventListener('change', ev => { const t = ev.target; if (t.dataset.actChange === 'ex-sort') { state.explore.sort = t.value; rerenderKeep(); } });
document.addEventListener('submit', ev => {
  ev.preventDefault(); const f = ev.target;
  if (f.id === 'cta-form') confirmCta(f.dataset.id);
  if (f.id === 'bo-acct') { state.biz.account = { name: $('#bo-name').value || 'Ringside Kitsilano', email: $('#bo-email').value }; state.biz.step = 1; render(); window.scrollTo(0, 0); }
  if (f.id === 'prof-form') { save(); toast('Profile saved. Members see the update right away.', { label: 'View', act: 'go-member-biz' }); }
});

/* ---------- Boot ---------- */
load();
render();

</script>
